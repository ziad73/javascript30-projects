<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Drum Kit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span class="sound">clap</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span class="sound">hihat</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span class="sound">kick</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span class="sound">openhat</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span class="sound">boom</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span class="sound">ride</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span class="sound">snare</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span class="sound">tom</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span class="sound">tink</span>
    </div>
  </div>

  <audio data-key="65" src="sounds/clap.wav"></audio>
  <audio data-key="83" src="sounds/hihat.wav"></audio>
  <audio data-key="68" src="sounds/kick.wav"></audio>
  <audio data-key="70" src="sounds/openhat.wav"></audio>
  <audio data-key="71" src="sounds/boom.wav"></audio>
  <audio data-key="72" src="sounds/ride.wav"></audio>
  <audio data-key="74" src="sounds/snare.wav"></audio>
  <audio data-key="75" src="sounds/tom.wav"></audio>
  <audio data-key="76" src="sounds/tink.wav"></audio>

<script>
  function playSound(e){
    // map pressed key to audio
    const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);// select one
    if(!audio) 
      return;
    audio.currentTime =0;// rewind to start FFFF
    audio.play();

    // map pressed key to key
    const key = document.querySelector(`.key[data-key="${e.keyCode}"]`);// select one
    // console.log(key);

    // Add animation: add html class attribute to key, so css class links with html class
    // Elements tab in dev tool: once you hit 'A' key, <div data-key="65" class="key playing"> which shows .key and .playing css classes
    key.classList.add('playing');
  }

  function removeTransition(e){
      // remove playing class
      if(e.propertyName !== 'transform') return;// skip if it's not transofrm
      e.target.classList.remove('playing');
  }
  // play sound and add transition
  document.addEventListener('keydown', (e)=> playSound(e));
  
  // remove transition
  // we can use setTimeout with classList.remove or
  // loop on all keys and remove playing class, event type is transitionend
  const keys = document.querySelectorAll('.key');
  for(let key of keys){
    key.addEventListener('transitionend', (e)=> removeTransition(e));
  }

</script>


</body>
</html>
