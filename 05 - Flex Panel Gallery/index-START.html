<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Panels 💪</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC' rel='stylesheet' type='text/css'>
  <link rel="icon" href="https://fav.farm/✅" />
</head>
<body>
  <style>
    html {
      box-sizing: border-box;
      background: #ffc600;
      font-family: 'helvetica neue';
      font-size: 20px;
      font-weight: 200;
    }

    body {
      margin: 0;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    .panels {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .panel {
      background: #6B0F9C;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.1);
      color: white;
      text-align: center;
      align-items: center;
      /* Safari transitionend event.propertyName === flex */
      /* Chrome + FF transitionend event.propertyName === flex-grow */
      transition:
        font-size 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        flex 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        background 0.2s;
      font-size: 20px;
      background-size: cover;
      background-position: center;
      flex: 1;/*pic evenly distributed*/
      justify-content: center;
      display: flex;
      flex-direction: column;/*horizontally centered*/
    }

    .panel1 { background-image: url(https://images.unsplash.com/photo-1443891238287-325a8fddd0f7?w=1500&h=1500); }
    .panel2 { background-image: url(https://cdn.pixabay.com/photo/2017/08/07/16/48/green-2605621_1280.jpg); }
    .panel3 { background-image: url(https://images.unsplash.com/photo-1465188162913-8fb5709d6d57?w=1500&h=1500); }
    .panel4 { background-image: url(https://images.unsplash.com/photo-1442522772768-9032b6d10e3e?w=1500&h=1500); }
    .panel5 { background-image: url(https://images.unsplash.com/photo-1465156799763-2c087c332922?w=1500&h=1500); }

    /* Flex Items */
    .panel > * {
      margin: 0;
      width: 100%;
      transition: transform 0.5s;
      flex: 1 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /*words in the panel*/
    .panel > *:first-child { transform: translateY(-100%); }/* zoom out*/
    .panel.open-active > *:first-child { transform: translateY(0); } /* zoom in */
    .panel > *:last-child { transform: translateY(100%); }
    .panel.open-active > *:last-child { transform: translateY(0); }

    .panel p {
      text-transform: uppercase;
      font-family: 'Amatic SC', cursive;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
      font-size: 2em;
    }

    .panel p:nth-child(2) {
      font-size: 4em;
    }

    .panel.open {
      /*grow panel size vertically by 5*/
      flex: 5;  /*flex-grow*/
      font-size: 40px; /*text size at open*/
    }

    @media only screen and (max-width: 600px) {
      .panel p {
        font-size: 1em;
      }
    }
  </style>


  <div class="panels">
    <div class="panel panel1">
      <p>Hey</p>
      <p>Let's</p>
      <p>Dance</p>
    </div>
    <div class="panel panel2">
      <p>Give</p>
      <p>Take</p>
      <p>Receive</p>
    </div>
    <div class="panel panel3">
      <p>Experience</p>
      <p>It</p>
      <p>Today</p>
    </div>
    <div class="panel panel4">
      <p>Give</p>
      <p>All</p>
      <p>You can</p>
    </div>
    <div class="panel panel5">
      <p>Life</p>
      <p>In</p>
      <p>Motion</p>
    </div>
  </div>

  <script>
    // on click on a panel: toggle open + open-active classes
    // flex is something cool, check it out!

    // select all panels
    const panels = document.querySelectorAll('.panel');
    // toggle open class
    for(let panel of panels) {
      panel.addEventListener('click', () => {
        // console.log(panel);
        panel.classList.toggle('open');// toggle .open class to the clicked panel
      });
    }
    // toggle open-active class IFF panel was open
    for(let panel of panels) {
      panel.addEventListener('transitionend', (e) => {
        // if the transition is flex-grow (.open class is present), then toggle open-active class
        if(e.propertyName.includes('flex-grow') && panel.classList.contains('open'))
          panel.classList.toggle('open-active');
      });
    }
  </script>

</body>
</html>
