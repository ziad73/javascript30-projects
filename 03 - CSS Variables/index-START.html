<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>

  <div class="controls">
    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="blur" min="0" max="25" value="10" data-sizing="px">

    <label for="base">Base Color</label>
    <input id="base" type="color" name="base" value="#ffc600">
  </div>

  <img src="https://unsplash.it/800/500?image">

  <style>

    /* css variables
      set a var: --varName
      access a var in css: var(--varName)
      access a var in js: document.documentElement.style.getPropertyValue('--varName')
    */

    :root{ /*global, highest level*/
      --base:yellow;
      --spacing: 10px;
      --blur: 10px;
    } /*dynamicaly managed by js*/


    img {
      padding: var(--spacing);
      background: var(--base);
      filter: blur(var(--blur));
    }
    .hl{ 
      color: var(--base);
    }
    /*
      misc styles, nothing to do with CSS variables
    */

    body {
      text-align: center;
      background: #193549;
      color: white;
      font-family: 'helvetica neue', sans-serif;
      font-weight: 100;
      font-size: 50px;
    }

    .controls {
      margin-bottom: 50px;
    }

    input {
      width: 100px;
    }
  </style>

  <script>
    // customize the css variables based on the user input
    
    const inputs = document.querySelectorAll('.controls input');// all inputs

    function handleUpdate(){// this = event object
      // console.log(this.name);// blur, spacing, base
      // console.log(this.value);// 10, 10, #ffc600

      // suffix user input e.g, 10 to px: 10px
      const suffix = this.dataset.sizing || '';

      // assign user input to css variable
      this.style.setProperty(`--${this.name}`, this.value + suffix);// setProperty(varName, value)

      // console.log(this.value + suffix);
    }

    // event listener
    for(let input of inputs){
      input.addEventListener('change', handleUpdate);
      input.addEventListener('mousemove', handleUpdate);
    }
  </script>

</body>
</html>
